[package]
name = "horizon-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Command-line interface for the Horizon durable agent runtime."

[[bin]]
name = "horizon"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap = { workspace = true, features = ["env"] }
horizon-core = { path = "../horizon-core" }
horizon-memory = { path = "../horizon-memory" }
horizon-runtime = { path = "../horizon-runtime" }
horizon-store = { path = "../horizon-store" }
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
