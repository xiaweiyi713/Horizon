name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: horizon
          POSTGRES_PASSWORD: horizon
          POSTGRES_DB: horizon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U horizon -d horizon"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Format
        run: cargo fmt --all -- --check
      - name: Rust tests
        env:
          HORIZON_POSTGRES_URL: postgresql://horizon:horizon@127.0.0.1:5432/horizon
        run: cargo test --workspace --all-features
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Build native Python wheel
        run: |
          python3 -m pip install 'maturin>=1.9,<2.0'
          maturin build --manifest-path crates/horizon-py/Cargo.toml --out dist
          python3 -m pip install dist/*.whl
          python3 -c 'import horizon_native; assert hasattr(horizon_native, "Runtime")'
          PYTHONPATH=python python3 - <<'PY'
          from horizon_agent import NativeHorizonRuntime
          runtime = NativeHorizonRuntime(":memory:", checkpoint_every=0)
          created = runtime.create_run("native CI")
          run_id = created["projection"]["run_id"]
          assert created["projection"]["cognitive"]["primary_goal"] == "native CI"
          outcome = runtime.apply_intervention(run_id, {
              "policy_id": "ci-contract",
              "policy_version": "v1",
              "risk_score_milli": 800,
              "threshold_milli": 700,
              "signals": {"steps_since_anchor": 1, "context_pressure": 0.8},
              "action": "inject_anchor",
              "reason": "validate native learned-intervention command",
          })
          assert [event["type"] for event in outcome["events"]] == [
              "state_decay_assessed", "state_anchor_injected"
          ]
          memory = runtime.create_memory(
              run_id,
              "Recover PostgreSQL from checkpoint before retrying the migration.",
              kind="episodic",
              source_event_id="5ba9b609-ed29-4e65-af43-bd9d1bcdb539",
              importance=0.9,
              confidence=0.95,
          )
          assert memory["events"][0]["type"] == "memory_created"
          retrieval = runtime.retrieve_semantic_memory(
              run_id, "recover postgres checkpoint", limit=4
          )
          assert retrieval["events"][0]["type"] == "semantic_memory_retrieved"
          PY
      - name: Python tests
        run: PYTHONPATH=python:. python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Fault injection
        run: PYTHONPATH=python python3 tests/fault_injection.py
      - name: Benchmark smoke suite
        run: python3 benchmarks/horizonbench/run.py --output-dir results/horizonbench
